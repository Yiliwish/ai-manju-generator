services:
  - type: web
    name: manzao-ai-manju-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope.aliyuncs.com
      - key: DASHSCOPE_IMAGE_MODEL
        value: qwen-image-3.0-pro
      - key: DASHSCOPE_REGION
        value: beijing
      - key: DASHSCOPE_WORKSPACE_ID
        sync: false
      - key: DASHSCOPE_VIDEO_MODEL
        value: MiniMax/MiniMax-H3
